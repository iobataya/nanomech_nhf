[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanomech"
version = "0.1.0"
description = "Nanomechanical anaylses"
authors = [{ name = "Ikuo Obataya", email = "obataya@qd-japan.com" }]
license = {text = "MIT License"}
readme = "README.md"
keywords = ["nanosurf", "forcespectroscopy", "elasticanalyais", "viscoelasticanalyais", "afm", "spm",]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]
dependencies = ["nanosurf>=2.0.0", "matplotlib", "numpy", "scipy", "pandas"]
requires-python = ">=3.12"

[project.optional-dependencies]
gui = ["PySide6>=6,<7"]

[project.gui-scripts]
nanomech-gui = "nanomech_gui.app:main"

[project.urls]
Repository = "https://github.com/iobataya/nanomech_nhf"

[tool.setuptools]
packages = { find = { include = ["nanomech", "nanomech.*", "nanomech_gui", "nanomech_gui.*"], exclude = ["tests", "tests.*", "tests_gui", "tests_gui.*"] } }

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
