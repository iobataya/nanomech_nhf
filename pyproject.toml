[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanomech"
version = "0.1.0"
description = "Nanomechanical anaylses"
authors = [{ name = "Ikuo Obataya", email = "obataya@qd-japan.com" }]
license = {text = "MIT License"}
readme = "README.md"
keywords = ["nanosurf", "elasticanalyais", "viscoelasticanalyais", "afm","spm",]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]
dependencies = ["nanosurf", "matplotlib", "numpy", "scipy", "pandas"]
requires-python = ">=3.12"
[project.urls]
Repository = "https://github.com/iobataya/nanomech_nhf"

[tool.setuptools]
packages = { find = { exclude = ["tests"] } }